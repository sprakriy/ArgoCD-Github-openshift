apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tekton-triggers-listener-clusterrole
rules:
  # Core Tekton Triggers Group (Covers v1alpha1, v1beta1, and all resources)
  - apiGroups: ["triggers.tekton.dev"]
    resources: 
      - eventlisteners
      - triggerbindings
      - triggertemplates
      - triggers
      - interceptors
      - clusterinterceptors
      - clustertriggerbindings
    verbs: ["get", "list", "watch"]
  # Pipeline Execution Group
  - apiGroups: ["tekton.dev"]
    resources: ["taskruns", "pipelineruns"]
    verbs: ["create", "get", "list", "watch"]
  # Core Infrastructure Objects
  - apiGroups: [""]
    resources: ["configmaps", "serviceaccounts", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-triggers-listener-clusterbinding
subjects:
  - kind: ServiceAccount
    name: tf-runner-sa
    namespace: tf-automation-gate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-listener-clusterrole

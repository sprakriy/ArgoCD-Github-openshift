apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: terraform-executor
  namespace: tf-automation-gate
spec:
  params:
    - name: git-url
      description: "The HTTPS URL of the repo to clone"
    - name: terraform-dir
      description: "The sub-folder"
      default: "."
    - name: action
      default: "apply"
      description: "Set to 'apply' or 'destroy' for Step 5"
  workspaces:
    - name: source
      description: "This is our 5Gi tf-pvc workbench"
  steps:
    - name: fetch-source
      image: alpine/git
      imagePullPolicy: Always # <--- FORCES the engine to pull the remote manifest every time
      #workingDir: $(workspaces.source.path)
      # 🛠️ Rule 1: Allows the container engine to set workingDir to the PVC path
      workspaces:
        - name: source
      script: |
        #!/bin/sh
        rm -rf ./* .??* 
        git clone $(params.git-url) .

    - name: tf-init-execute
      #image: hashicorp/terraform:1.6.0
      image: hashicorp/terraform:1.7.5 # <--- Explicitly multi-arch tagged image
      imagePullPolicy: Always # <--- FORCES the engine to pull the remote manifest every time
      #workingDir: $(workspaces.source.path)  # Keep base path rooted
      # 🛠️ Rule 2: Allows Terraform to read the files cloned by the first step
      workspaces:
        - name: source
      env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-creds
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-creds
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_SESSION_TOKEN
          valueFrom:
            secretKeyRef:
              name: aws-creds
              key: AWS_SESSION_TOKEN
      script: |
        #!/bin/sh
        # Map target directory accurately from root
        TARGET_DIR="$(workspaces.source.path)/$(params.terraform-dir)"

        echo "✍️ Generating remote S3 state backend at: ${TARGET_DIR}/backend_generated.tf"
        cat <<EOF > ${TARGET_DIR}/backend_generated.tf
        terraform {
          backend "s3" {
            bucket = "sp-01102026-aws-kub"
            key    = "openshift-project/terraform.tfstate"
            region = "us-east-1"
          }
        }
        EOF

        echo "🔄 Initializing Modular Infrastructure..."
        terraform -chdir="${TARGET_DIR}" init -input=false

        echo "🚀 Executing Target Strategy: terraform $(params.action)"
        terraform -chdir="${TARGET_DIR}" $(params.action) -auto-approve